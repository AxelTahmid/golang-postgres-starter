version: "2"
sql:
  - engine: "postgresql"
    schema: "./internal/db/migrations/*.sql"
    queries: "./internal/db/query/*.sql"
    gen:
      go:
        package: "sqlc"
        sql_package: "pgx/v5"
        out: "./internal/db/sqlc"
        emit_json_tags: true
        json_tags_case_style: "snake"
        emit_pointers_for_null_types: true
        # override_type:
        #   - db_type: "jsonb"
        #     go_type: "github.com/jackc/pgx/v5/pgtype.JSONBCodec"
