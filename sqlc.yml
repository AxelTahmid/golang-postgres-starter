version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/db/migrations"
    queries: "internal/db/queries"
    # database:
    #   uri: "<db_uri>"
    gen:
      go:
        package: "sqlc"
        sql_package: "pgx/v5"
        out: "./internal/db/sqlc"
        emit_json_tags: true
        json_tags_case_style: "snake"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
